x-service: &service
  build:
    context: .
    dockerfile: services/Dockerfile
    target: service
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 10

services:
  sandbox-image:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: sandbox
    image: goback-harness-sandbox:dev
    command: ["true"]

  sandbox-manager:
    <<: *service
    build:
      context: .
      dockerfile: services/Dockerfile
      target: manager
    command: ["python", "-m", "uvicorn", "manager:app", "--app-dir", "services/sandbox-manager", "--host", "0.0.0.0", "--no-access-log"]
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    environment:
      SANDBOX_CPU: ${SANDBOX_CPU:-1}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-256m}
      SANDBOX_PIDS: ${SANDBOX_PIDS:-64}
      SANDBOX_DISK: ${SANDBOX_DISK:-64m}
      SANDBOX_EXEC_TIMEOUT_S: ${SANDBOX_EXEC_TIMEOUT_S:-20}
    devices: ["/dev/fuse:/dev/fuse"]
    cap_add: [SYS_ADMIN]
    security_opt: ["apparmor:unconfined"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /run/goback-harness
        target: /run/goback-harness
        bind:
          propagation: rshared
          create_host_path: true
    ports: ["${GOBACK_BIND:-127.0.0.1}:${GOBACK_SSH_PORT:-2222}:2222"]

  llm-proxy:
    <<: *service
    command: ["python", "-m", "uvicorn", "proxy:app", "--app-dir", "services/llm-proxy", "--host", "0.0.0.0", "--no-access-log"]
    environment:
      LLM_MODE: ${LLM_MODE:-fixture}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-6.1-terra}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_PROVIDER_URL: ${LLM_PROVIDER_URL:-https://api.openai.com/v1}

  harness:
    <<: *service
    command: ["python", "-m", "uvicorn", "harness:app", "--app-dir", "services/harness", "--host", "0.0.0.0", "--no-access-log"]
    depends_on:
      sandbox-manager:
        condition: service_healthy
      llm-proxy:
        condition: service_healthy
    volumes:
      - traces:/var/lib/goback/traces

  gateway:
    <<: *service
    command: ["python", "-m", "uvicorn", "gateway:app", "--app-dir", "services/gateway", "--host", "0.0.0.0", "--no-access-log"]
    depends_on:
      harness:
        condition: service_healthy
    environment:
      CLIENT_TOKENS: ${CLIENT_TOKENS:-goback-local-demo}
      GOBACK_SSH_PORT: ${GOBACK_SSH_PORT:-2222}
    ports: ["${GOBACK_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8000"]

volumes:
  traces:
